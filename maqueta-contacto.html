<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contacto — ST Relaciones Públicas (maqueta)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Karla:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --color-paper: #F7F8F3; --color-navy: #012C3D; --color-teal: #78BDC4; --color-coral: #F8444F;
    --color-navy-soft: #0a3a4d; --color-paper-soft: #eceee4; --color-teal-soft: #e4f2f3;
    --font-heading: 'Montserrat', sans-serif; --font-body: 'Karla', sans-serif; --font-data: 'Karla', sans-serif;
    --font-accent: 'Playfair Display', serif;
    --fw-bold: 700; --fw-medium: 500;
    --radius-sm: 6px; --radius-md: 12px; --radius-lg: 20px; --radius-pill: 999px;
    --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-4: 40px; --space-5: 64px; --space-6: 96px;
    --shadow-sm: 0 2px 8px rgba(1,44,61,0.08); --shadow-md: 0 8px 24px rgba(1,44,61,0.12); --shadow-lg: 0 16px 48px rgba(1,44,61,0.18);
    --container: 1180px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-body); font-weight: var(--fw-medium); color: var(--color-navy); background: var(--color-paper); line-height: 1.6; }
  h1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--fw-bold); line-height: 1.15; margin: 0 0 var(--space-2); }
  p { margin: 0 0 var(--space-2); }
  a { color: inherit; text-decoration: none; }
  .container { max-width: var(--container); margin: 0 auto; padding: 0 var(--space-3); }
  .data { font-family: var(--font-data); }
  section { padding: var(--space-5) 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 28px; border-radius: var(--radius-pill); font-family: var(--font-heading); font-weight: var(--fw-bold); font-size: 15px; border: 2px solid transparent; cursor: pointer; }
  .btn-coral { background: var(--color-coral); color: #fff; box-shadow: var(--shadow-sm); }
  .btn-block { width: 100%; }
  .breadcrumb { font-family: var(--font-data); font-size: 13px; opacity: .6; padding: var(--space-2) 0; }
  .section-eyebrow { font-family: var(--font-data); text-transform: uppercase; letter-spacing: .1em; font-size: 13px; font-weight: 700; color: var(--color-coral); margin-bottom: 8px; }

  .contacto-hero { background: var(--color-navy); color: var(--color-paper); padding: var(--space-5) 0; text-align: center; }
  .contacto-hero h1 { font-size: 34px; color: #fff; }
  .contacto-hero p { opacity: .8; max-width: 480px; margin: 0 auto; }

  .contacto-inner { display: grid; grid-template-columns: .8fr 1.2fr; gap: var(--space-5); align-items: start; }
  .contacto-info { display: flex; flex-direction: column; gap: var(--space-3); }
  .info-item { display: flex; align-items: flex-start; gap: 12px; }
  .info-item .icon { width: 40px; height: 40px; border-radius: 10px; background: var(--color-teal-soft); display: flex; align-items: center; justify-content: center; flex: none; }
  .info-item h4 { font-size: 14px; margin: 0 0 2px; }
  .info-item p { font-size: 14px; opacity: .75; margin: 0; }
  .redes { display: flex; gap: 10px; margin-top: 8px; }
  .redes a { width: 36px; height: 36px; border-radius: 50%; background: var(--color-navy); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }

  .form-card { background: #fff; border-radius: var(--radius-lg); padding: var(--space-4); box-shadow: var(--shadow-md); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: var(--space-2); }
  .form-field.full { grid-column: 1 / -1; }
  .form-field label { font-size: 13px; font-weight: 700; font-family: var(--font-heading); }
  .form-field input, .form-field select, .form-field textarea {
    font-family: var(--font-body); font-size: 14px; padding: 12px 14px; border-radius: var(--radius-sm);
    border: 1px solid rgba(1,44,61,.2); background: var(--color-paper); color: var(--color-navy);
  }
  .form-field textarea { resize: vertical; min-height: 110px; }

  @media (max-width: 900px) {
    .contacto-inner { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container breadcrumb"><a href="maqueta-st-rrpp.html">Inicio</a> / Contacto</div>

<section class="contacto-hero">
  <div class="container">
    <h1>Hablemos</h1>
    <p>Contanos qué necesitás y te respondemos a la brevedad.</p>
  </div>
</section>

<section>
  <div class="container contacto-inner">
    <div class="contacto-info">
      <div class="info-item">
        <div class="icon">✉️</div>
        <div><h4>Email</h4><p>hola@strelacionespublicas.com.ar</p></div>
      </div>
      <div class="info-item">
        <div class="icon">📱</div>
        <div><h4>WhatsApp</h4><p>+54 9 11 [ número ]</p></div>
      </div>
      <div class="info-item">
        <div class="icon">📍</div>
        <div><h4>Ubicación</h4><p>Buenos Aires, Argentina — atención a todo LatAm</p></div>
      </div>
      <div>
        <h4 style="font-size:14px;">Redes</h4>
        <div class="redes">
          <a href="#" aria-label="Instagram">IG</a>
          <a href="#" aria-label="LinkedIn">in</a>
        </div>
      </div>
    </div>

    <form class="form-card">
      <div class="form-grid">
        <div class="form-field">
          <label for="c-nombre">Nombre</label>
          <input type="text" id="c-nombre" required>
        </div>
        <div class="form-field">
          <label for="c-email">Email</label>
          <input type="email" id="c-email" required>
        </div>
        <div class="form-field full">
          <label for="c-asunto">Asunto</label>
          <select id="c-asunto">
            <option>Consulta sobre un curso</option>
            <option>Capacitación in company</option>
            <option>Consultoría</option>
            <option>Prensa / speaking</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="form-field full">
          <label for="c-mensaje">Mensaje</label>
          <textarea id="c-mensaje" required></textarea>
        </div>
      </div>
      <button type="submit" class="btn btn-coral btn-block">Enviar mensaje</button>
    </form>
  </div>
</section>

</body>
</html>
